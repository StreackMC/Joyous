## JOYOUS CONFIG
## * 配置存在错误或不存在会视作默认值，但不推荐这么做
## 注释中[$?]表示填写的值

## JMenu 模块
# 提供双端通用菜单和在线编辑器：
# 在线编辑菜单：https://mc.kdxiaoyi.top/Joyous-MenuEditor/
JMenu:
  ## 是否启用
  # * 不支持热重载
  enabled: true
  ## 菜单物品设置
  menu-item:
    ## 显示的图标
    # Minecraft标准物品名，不含命名空间
    material: "clock"
    ## 特化
    # 启用后只有插件给予的菜单才能使用
    # 同时只要物品有插件的特殊数据就能打开菜单
    specialized: true
    ## 显示
    # 至少1行。首行为物品名，其它为描述
    display:
      - "&b菜单"
      - "&7Powered by StreackMC/Joyous."
      - 每行开头无需手动重置样式，会自动重置。这行文本就不是斜体嫣紫的。
    ## 给予
    # 进入服务器时背包没有菜单是否要给一个新的
    # ！禁用后你需要手动处理菜单给予，要不然就需要开放命令 /jmenu open 或者 /jmenu get 。
    give: false
  ## 命令别名
  # 默认命令为 /jmenu
  alias: []
  ## 冷却
  # 玩家需要间隔多久才能再次打开菜单。使用 /jmenu open [menu] 指定菜单可以绕过。
  cooldown: 3
  ## 缓存时长
  # 一个菜单被访问以后会在接下来的 $? 秒内被持续加载，这可以提升高访问量的菜单的响应速度，减少 IO 开销；
  # 本功能的内存开销几乎可以忽略（相较整个服务器而言）；
  # 但需要注意缓存有效期内菜单文件不会自动重载，需要手动使用命令 /jmenu reload 可以立即删除全部缓存；
  # PHAPI（若有）仍是在打开菜单时解析的
  cahce_ttl: 1800

## JStatusAPI 模块
# 用于提供在线查询API
JStatusAPI:
  ## 是否启用
  # 需要 StreackLib 中启用 HTTPServer
  # * 不支持热重载
  enabled: true
  ## 监听路径
  # 必须以 / 开头，将作为 JStatusAPI 的基路径。
  # * 留空表示不启用
  # * 不支持热重载
  baseurl: "/japi/"
  ## 跨域请求（CORS）标头
  # 在前端应用中，浏览器会限制跨域请求，即只允许下面配置的域名和同域名获取数据。
  # 这个设置具体控制Access-Control-Allow-Origin标头的内容，它可以为：
  # 1. "*"：允许所有域名；
  # 2. "null"：只允许同域名（此用法已被MDN不推荐使用）；
  # 3. 单个具体域名，例如 "https://example.com"：只允许该域名获取数据。
  cors-allowed: "*"
  ## 缓存时长
  # 对于 StatusAPI ，连续两次刷新数据需要间隔的时间。单位：秒
  cache: 60
  ## 名单模式
  # 启用即白名单，只允许查询匹配的；否则为黑名单，允许查询全部不匹配的（不推荐）
  white-mode: true
  ## 限制查询的 Placeholders 名单列表
  # 无需携带「%」，支持两种写法：
  # 1. 普通字符串，全匹配（忽略大小写）
  # 2. "regex:正则表达式"  正则匹配
  ph_list:
    - "player_name"
    - "server_online"
    - "regex:server_.*"

## Entroprix（熵流） 模块
# 随机抽卡系统，允许定义 保底 多金 up 等数据
# 相较于数据包的战利品表而言更简洁易用
# 参见 entroprix.yml
Entroprix:
  ## 是否启用
  # * 不支持热重载
  enabled: true
  ## 最大连续抽取次数
  # 用于限制 roll 子命令中的最大次数，原版上限为 65535
  # 同时抽取次数过大会导致服务器严重卡顿（抽卡主要开销来自执行命令）
  # * 无论如何设置，都不能超过 1000
  # * 设为比1小的值会导致无法抽卡
  max: 100
  ## 命令别名
  # 默认命令为 /entroprix
  alias:
    - "gacha"

## PlayerTitle 模块
# 一个十分轻量、轻量过头的玩家称号系统，基本原理是提供一个 Placeholder ，传入时判断玩家偏好来返回对应称号，并通过权限来控制是否拥有所有权。
# 参见 models/playerTitles.yml 来添加称号
PlayerTitle:
  ## 是否启用
  # * 不支持热重载
  enabled: true
  ## 称号前缀
  prefix: "&7「"
  ## 称号后缀
  suffix: "&7」&r"
  ## 命令别名
  # 默认命令为 /playertitle
  alias:
    - "ptitle"

## Mails 模块
Mails:
  ## 是否启用
  # * 不支持热重载
  enabled: true

## Neonaic 模块
# Neonai Connector 是 StreackMC 编写的另外一个用于 AI 和聊天机器人的 NodeJS 应用
# 这是总开关
Neonaic:
  ## 是否启用
  # * 不支持热重载
  enabled: true

## Restarter 模块
# 本模块的基本用法是
# /jrestart [秒数] [理由] - 计划重启并全服通知
# /jstop [秒数] [理由] - 计划关闭并全服通知
# 重启有两种工作模式，由下面的 preventInterrupt 决定：
# 一、自行重启（preventInterrupt: true）
#     由本插件拉起服务器，需要 /spigot.yml 的 settings.restart-script 指向可用脚本
#     并确保脚本有执行权限，否则"重启"会退化为"关闭"
# 二、外部重启（preventInterrupt: false）
#     本插件只负责"关闭"，由外部守护进程（systemd / Docker / 面板）在进程退出后拉起，
#     因此不需要 restart-script；/jrestart 与自动重启都等同于计划关闭
# 为提供开发能力，自行重启时服务器控制台会输出一行类似 [Joyous] →​J​o​y​o​u​s​← 的日志，其中箭头中间的每个字母的两边都有一个 \u200b 字符，共计7个。
Restarter:
  ## 是否启用
  # * 不支持热重载
  enabled: true
  ## 是否由本模块自行接管重启（同时是"异常关闭后自动重启"的开关）
  # 启用后：本模块自行拉起服务器，因此任何非 /jstop 的关闭都会被视作异常并转为重启，
  #         只有 /jstop 可以安全关闭服务器；需要正确配置 spigot.yml 的 restart-script
  # 禁用此项后，下文全部“重启”都将直接关闭服务器，需要配合外部重启
  #         即由外部守护进程在进程退出后把服务器拉起来
  preventInterrupt: false
  ## 是否要展示顶部倒计时条
  showBossbar: true
  ## 在没有输入秒数时的默认值
  defaultTimeout: 60
  ## 配置自动重启
  autoRestart:
    ## 自动重启时的倒计时（秒）
    # 等于0立即重启，小于0禁用本功能
    timeout: -1
    ## 触发时间条件
    # 匹配规则：
    # * hour / min / sec 之间是「与」关系，未填写（或越界）的字段视为通配。
    #   三者都填即表示"每天的那一秒"；例如 hour: 12 min: 0 sec: 0 = 每天 12:00:00。
    # * weekday / days / dayOfM 之间是「或」关系，它们只是描述"哪些天"的不同写法。
    # * 日期条件与时刻条件是「与」关系：既要落在指定时刻，也要落在指定日期。
    # * 全部留空或全部越界时永不触发。
    when:
      ## 在当天的什么时候计划重启
      # 计划后会经过上面的 timeout 倒计时秒
      hour: 12
      min: 00
      sec: 00
      ## 每周?
      # 支持混排，示例为星期一、四、六
      weekday: 164
      ## ?月?日
      # * 请务必加引号：不加引号时 YAML 会把 7.2 解析成浮点数，
      #   而 2.30 会被解析成 2.3（即 2 月 3 日），与你写的字面意思不同
      # * 超出该月真实天数的值（如 2 月 30 日）会被忽略
      days:
        - "7.2"
        - "2.30" # 非法值会被忽略
      ## 每月的特定日
      dayOfM:
        - 1 # 1日
        - ?5 # 5、15、25日
        - 1? #10...19日
    ## 触发其它条件（事件触发，非时间触发）
    while:
      ## 内存检测检查间隔（秒）
      # while 条件以独立调度器运行，不依赖 when 的每秒检查
      checkInterval: 20
      ## 老年代（Old Gen）占用率阈值（百分比）
      # 使用老年代而非整体堆内存，因为 New Gen 的波动不应触发重启
      # 默认 85%，为 GC 留出回收机会
      # <= 0 禁用
      oldGenPercent: 85
      ## 连续采样失败次数
      # 连续 N 次检查都超过阈值才触发重启，避免单次抖动误判
      samples: 2
      ## 重启间隔下限（分钟）
      # 两次因内存原因触发的重启之间的最小间隔
      # 防止短期内多次重启影响服务，默认 60 分钟
      minRestartInterval: 60
      ## 内存泄漏检测
      # 判据：比较相邻两个等长基线的「GC 后地板」（MemoryPoolMXBean.getCollectionUsage）中位数，
      # 地板持续抬升即认为存在泄漏，从而在占用率还没到阈值时就提前重启。
      # 注意它衡量的是"回收后的水平"，不受采样间隔影响；因此不要改成依赖 Full GC 计数——
      # 现代 G1 上那个计数只在真正的 Pause Full 时递增，实测老年代到 94% 都还是 0。
      leakDetection:
        # 是否启用
        enabled: true
        # 基线长度（分钟）。相邻两个基线各取这么长，比较它们的地板中位数。
        # * 太短：老年代两次回收之间的自然增长会被误判为泄漏
        # * 太长：发现泄漏更晚
        baselineMinutes: 10
        # 地板抬升阈值（%）。实测参考：
        # * 常驻集固定的健康负载（含正常锯齿）：相邻基线抬升 0.0%～1.1%
        # * 稳定泄漏：抬升 25% 以上
        floorGrowthPercent: 10
        # 已知局限：如果业务本身的常驻数据在基线跨度内显著增长（例如在线人数翻倍），
        # 地板也会抬升并被判为泄漏。这类增长与真泄漏在信号上无法区分，
        # 由上面的 minRestartInterval 重启间隔下限兜底。
      ## 堆转储
      # 当因内存泄漏触发重启时，可选生成堆转储文件
      # 可使用 VisualVM / JProfiler 分析堆转储以定位泄漏对象
      heapDump:
        # 是否启用
        enabled: false
        # 堆转储文件存放目录（相对于服务器根目录）
        path: "dumps/"
        # 最多保留多少份堆转储，超出的按时间从旧到新删除
        # 堆转储体积通常与堆大小相当，不限制会撑满磁盘
        keep: 3
    ## 重启后保留假人的兼容性配置
    # 本功能只要启动都会自动生效，无论由于什么而启动
    # 假人名册保存在 models/Restarter.dat.json：
    # * 关服/重启前会自动并入"在线且拥有 identify.perm 权限"的玩家
    # * /jrestarter fp add|remove 的增删会立即落盘，不依赖关服流程
    # * 名册是常驻的，恢复完不会清空——它是服务器崩溃（不走关服流程）时唯一的恢复依据
    fp:
      # 功能开关
      enabled: true
      ## 怎么找到假人
      identify:
        # 拥有如下权限
        perm: 'streack.fakeplayer'
        # 启用后假人可以被命令 /jrestarter fp <add/remove> <player> 添加
        # * 注意：关服前的自动采集会重新并入"此时在线且拥有 perm 的玩家"，
        #   所以 remove 掉一个仍在线的假人，下次重启仍可能被重新识别
        command: true
      # 生成假人的命令
      # 此处以及后者的命令无需携带 / ，使用 %name% 插入假人名称
      spawn: 'fp spawn %name%'
      # 使假人登录的命令
      login: 'authme forcelogin %name%'
      # login 在玩家加入后执行的延迟毫秒
      delayOfJoin: 2000

## JwardChest 模块
# 「战利品箱」：把任意方块绑定成一个带搜索动画的自定义容器
# /jwardchest new            绑定准星方块并打开编辑界面（别名 /jc）
# /jwardchest unbind         解除准星方块的绑定
# /jwardchest reset ...      清除临时数据（结果组/搜索进度）
# /jwardchest reload         重新读取 models/JwardChest/profiles.yml
# 绑定关系写在区块 PDC（随区块存盘）；容器设置写在 models/JwardChest/profiles.yml；
# 结果组与搜索进度只在内存里，属于临时数据。
JwardChest:
  ## 是否启用
  # * 不支持热重载
  enabled: true
  ## 珍惜度（声明式）
  # 整套珍惜度由这里声明：一条就是一档，把它的显示名、配色、材质、搜索时长、音效
  # 全部写在同一条声明里 —— 代码里因此没有「按珍惜度分支」的 switch，
  # 也不存在「名字在一处、材质在另一处、音效又在第三个平行表里」。
  # * 顺序即强度：越靠下的越珍贵（「结果组里最高珍惜度」取最后一条）
  # * 键（左侧的 id）是稳定标识：容器的各档抽出数量、每条待选物品的珍惜度都按 id 落盘，
  #   所以【改 id 等于换了一档】，已有设置里那一档的值会读不回来（回落为默认）
  # * 可声明的字段（都有默认值，可以只写想改的那几个）：
  #     name     显示名（编辑器与命令里显示）
  #     color    文字颜色（原版遗留颜色码，如 "§a"）
  #     glass    进入紧急窗口后「搜索中」占位用的玻璃板
  #     wool     编辑界面「最大抽出数量」按钮的材质
  #     carpet   编辑界面「最小抽出数量」按钮的材质
  #     seconds  本档搜索基准时长（秒）；实际 = seconds + 物品数量 × search.amount-factor
  #     sound    搜索完成音效（原版音效键）
  #     volume   音量 / 传播范围（大于 1 会扩大可听范围）
  #     pitch    音高
  # 下面声明 6 档；可以增删条目、改名、调顺序（例如再插一档就照抄一条改 id 与 name）。
  rarities:
    common:
      name: "普通"
      color: "§f"
      glass: WHITE_STAINED_GLASS_PANE
      wool: WHITE_WOOL
      carpet: WHITE_CARPET
      seconds: 1.3
      sound: "entity.experience_orb.pickup"
      volume: 0.5
      pitch: 1.0
    rare:
      name: "稀有"
      color: "§a"
      glass: LIME_STAINED_GLASS_PANE
      wool: GREEN_WOOL
      carpet: GREEN_CARPET
      seconds: 1.9
      sound: "entity.experience_orb.pickup"
      volume: 0.8
      pitch: 1.2
    blue:
      name: "精良"
      color: "§b"
      glass: BLUE_STAINED_GLASS_PANE
      wool: BLUE_WOOL
      carpet: BLUE_CARPET
      seconds: 2.3
      sound: "entity.experience_orb.pickup"
      volume: 0.95
      pitch: 1.3
    collect:
      name: "典藏"
      color: "§d"
      glass: PURPLE_STAINED_GLASS_PANE
      wool: PURPLE_WOOL
      carpet: PURPLE_CARPET
      seconds: 2.8
      sound: "entity.player.levelup"
      volume: 1.1
      pitch: 1.4
    precious:
      name: "珍贵"
      color: "§6"
      glass: ORANGE_STAINED_GLASS_PANE
      wool: YELLOW_WOOL
      carpet: YELLOW_CARPET
      seconds: 4.6
      sound: "entity.player.levelup"
      volume: 1.4
      pitch: 1.6
    mythic:
      name: "绝世"
      color: "§c"
      glass: RED_STAINED_GLASS_PANE
      wool: RED_WOOL
      carpet: RED_CARPET
      seconds: 6.0
      sound: "ui.toast.challenge_complete"
      volume: 1.7
      pitch: 1.8
  ## 搜索
  search:
    ## 物品数量对搜索时长的系数（秒/个）
    # 影响很小，仅用于让数量多的结果稍微多花一点时间
    amount-factor: 0.03
    ## 紧急着色窗口（按本次搜索时长的比例算，再夹到下面两个边界里）
    # 窗口 = clamp(本次时长 × urgency-ratio, urgency-min-seconds, urgency-seconds)
    # 进入窗口后「玻璃板材质」与「文字颜色」会一起换成该档珍惜度的配色
    # （具体配色由上面每档声明里的 color / glass 决定）：
    #   * 粗筛阶段：换成「最高珍惜度」的配色，该阶段仍显示剩余秒数
    #   * 逐结果阶段：占位名不显示秒数，换成「该结果珍惜度」的配色
    # 注意：某档的紧急配色若与平时的白玻璃板相同（例如默认的普通档就是白），
    #   则该档只有名字颜色会变；若配了资源包模型（item_model），
    #   客户端画的是资源包贴图、材质颜色看不见，名字颜色则始终有效
    urgency-ratio: 0.25
    ## 窗口上限（秒）：长搜索不会整段都在闪颜色
    urgency-seconds: 2.0
    ## 窗口下限（秒）：短搜索也能看见颜色变化
    urgency-min-seconds: 0.5
    ## 动画刷新间隔（刻）
    # 2 刻 = 10fps（默认），4 刻 = 5fps，1 刻 = 20fps
    # 注意：显示文本已量化（粗筛按整秒、逐结果阶段恒定不变），本项只决定「多久检查一次状态」，
    # 实际发包量远低于这个刷新频率
    update-interval-ticks: 2
  ## 占位物品（黑色/白色玻璃板）的显示
  placeholder:
    ## 物品名
    name: "待搜索"
    ## Lore，第一行留空表示空行
    lore:
      - ""
    ## 资源包模型键（custom_model）——资源包靠它把占位物品画成自己的贴图
    # 原理：1.21.4+ 的物品可以用 item_model 组件指明「用哪个模型渲染」，
    #   资源包在 assets/<命名空间>/items/<路径>.json 里定义那个模型。
    #   我们把键写到占位玻璃板上，客户端就会画你资源包里的贴图，而不是玻璃板本身。
    # 三种写法，优先级从高到低：
    #   1) placeholder.model.unsearched / placeholder.model.searching
    #      —— 想给「未搜索(黑)」「搜索中(白)」配两套不同贴图时分别填这两个键；
    #   2) 本项 item-model —— 只做了一张贴图、两个状态共用时填这里；
    #      （上面两个键都没配，才会回落到本项，这就是「两者都未配置时才回落到本项」的意思）
    #   3) 三项全部留空 —— 不写模型组件，客户端显示玻璃板本色。
    #      PDC 标记照样会写，"占位物品不可拿走"的保护不受影响。
    # 键的写法：只能用小写 ASCII（a-z0-9._-/）；带 ":" 按「命名空间:路径」解析，
    #   不带 ":" 会被当成 minecraft: 命名空间下的路径 ——
    #   即 joyous_jc_unsearched 落在 assets/minecraft/items/，joyous:jc_unsearched 才落在 assets/joyous/items/。
    # 另外若下面的 custom-model-data 不为 0，会与 item_model 一起写入，方便用旧机制（CMD）的资源包共存。
    model:
      unsearched: ""
      searching: ""
    item-model: ""
    ## 原版 custom_model_data，0 表示不设置
    custom-model-data: 0
  ## 粗筛阶段的占位区域
  prefilter:
    rows: 2
    cols: 5
  ## 运行时状态
  session:
    # 这些都只在内存里，属于临时数据
    ## 空闲多久后回收会话（秒）
    # 只回收「无人打开」的会话，玩家正在看的不会被丢掉
    idle-timeout-seconds: 3600
    ## 清理任务间隔（秒）
    sweep-seconds: 60
    ## 同时存在的会话上限，超出时丢最久未访问的
    max-sessions: 512
    ## 单个容器最多展示的结果条数（还会再被容器槽位数夹一次）
    max-results: 54
    ## 聊天栏输入的等待超时（秒）
    chat-input-timeout: 60
  ## 命令
  command:
    ## /jwardchest new 能选中多远的方块
    reach: 6
    ## reset radius 的最大半径
    reset-radius-limit: 256

## 数据库档案名
# 需要在 StreackLib 中配置这个数据库档案
dbprofile: 'profile_mysql'

## 配置文件版本
version: 000300
# 如无必要请勿修改